    - heading "Our AI candidate started as a for-loop" [level=1] [ref=f1e111]
    - time [ref=f1e117]: 13 Sep, 2026
    - paragraph [ref=f1e118]: 9 min read
    - generic [ref=f1e119]:
      - button "Read aloud" [ref=f1e120] [cursor=pointer]
      - status [ref=f1e125]
    - article [ref=f1e126]:
      - paragraph [ref=f1e127]: The first version took an afternoon.
      - paragraph [ref=f1e128]:
        - text: "Our product runs job interviews with an AI. It talks, it listens, it decides what to ask next. To test it I needed something on the other side of the call, so I wrote the dumbest thing that could work: wait for the interviewer to say something, hand the text to"
        - code [ref=f1e129]: gpt-4.1-nano
        - text: ", send the reply back."
      - generic [ref=f1e131]:
        - code [ref=f1e132]:
          - generic [ref=f1e133]: const CANDIDATE_SYSTEM_PROMPT = [
          - generic [ref=f1e134]: "\"You are a senior software engineer attending a job interview.\","
          - generic [ref=f1e135]: "\"Answer in ONE short sentence, 20 words maximum, professionally.\","
          - generic [ref=f1e136]: "\"Stay on topic and never break character.\","
          - generic [ref=f1e137]: "].join(\" \");"
          - generic [ref=f1e138]: const CONVERSATION_TURNS = 3;
        - button "Copy" [ref=f1e139] [cursor=pointer]
      - paragraph [ref=f1e140]: Three turns. Twenty words each. It ran green on the first try, which felt great for about two weeks.
      - heading "Table of contents" [level=2] [ref=f1e141]:
        - text: Table of contents
        - link [ref=f1e142] [cursor=pointer]:
          - /url: "#table-of-contents"
          - text: "#"
      - paragraph
      - group [ref=f1e143] [cursor=pointer]:
        - generic "Open Table of contents" [ref=f1e144]
      - paragraph
      - heading "The assertion that asserted nothing" [level=2] [ref=f1e145]:
        - text: The assertion that asserted nothing
        - link [ref=f1e146] [cursor=pointer]:
          - /url: "#the-assertion-that-asserted-nothing"
          - text: "#"
      - paragraph [ref=f1e147]: "Here is what the test checked when it passed:"
      - generic [ref=f1e149]:
        - code [ref=f1e150]:
          - generic [ref=f1e151]: expect(chatClient.getHistory()).toHaveLength(CONVERSATION_TURNS * 2);
        - button "Copy" [ref=f1e152] [cursor=pointer]
      - paragraph [ref=f1e153]: Six messages exist. That’s it. Not that the answers were relevant. Not that the interviewer got anywhere. A candidate replying “yes” three times would have passed, and so would one replying in Latin.
      - paragraph [ref=f1e154]: I’d automated the shape of an interview and none of its content. The green tick was real; the test underneath it was decorative.
      - paragraph [ref=f1e155]: That would have stayed embarrassing-but-harmless if the product had stood still. It didn’t.
      - heading "Three turns is not an interview" [level=2] [ref=f1e156]:
        - text: Three turns is not an interview
        - link [ref=f1e157] [cursor=pointer]:
          - /url: "#three-turns-is-not-an-interview"
          - text: "#"
      - paragraph [ref=f1e158]: Real interviews don’t run for three turns. They run until the interviewer decides it’s done — six turns, twenty-six, depending entirely on how the candidate answers.
      - paragraph [ref=f1e159]:
        - text: A counter can’t express
        - emphasis [ref=f1e160]: stop when the other side stops
        - text: . Worse, it can’t tell the difference between an interview ending properly and one hanging, because both look like “the loop finished.”
      - paragraph [ref=f1e161]:
        - text: "So ending had to become a decision rather than a number. That meant giving the model a tool to make it with:"
        - code [ref=f1e162]: endInterview
        - text: .
      - paragraph [ref=f1e163]: That one change quietly ended the for-loop. Once the model decides when to stop, you’re in an agent loop whether you’ve called it one or not.
      - heading "Then it had to type" [level=2] [ref=f1e164]:
        - text: Then it had to type
        - link [ref=f1e165] [cursor=pointer]:
          - /url: "#then-it-had-to-type"
          - text: "#"
      - paragraph [ref=f1e166]: The next thing the product shipped was coding questions.
      - paragraph [ref=f1e167]:
        - text: A chat client can say “I’d use a hash map here” all day long. It cannot open the editor, write a solution, and run the tests against it. The moment a real candidate could be asked to
        - emphasis [ref=f1e168]: do
        - text: something instead of describe it, my fake one was mute in a way no assertion would catch — it would still answer, still sound plausible, still go green.
      - paragraph [ref=f1e169]: So the candidate needed hands.
      - paragraph [ref=f1e170]: Design questions came next, and brought a whiteboard — a third surface, with its own rules and a habit of covering the second one. After that, audio-only interviews, where the interviewer’s turn has no clean end signal at all. You infer it from text that stops growing.
      - paragraph [ref=f1e171]: None of that was foreseeable, and the for-loop was still the right first version. It was cheap, it proved the socket injection worked, and it told me inside a day that the idea was viable.
      - paragraph [ref=f1e172]:
        - text: What’s worth noticing is where the pressure came from. Not the model —
        - code [ref=f1e173]: gpt-4.1-nano
        - text: in a loop could hold a conversation fine. It came from the product’s surface area. Every new thing a real candidate could do was a new thing mine couldn’t, and each gap arrived disguised as a passing test.
      - heading "The loop that eats itself" [level=2] [ref=f1e174]:
        - text: The loop that eats itself
        - link [ref=f1e175] [cursor=pointer]:
          - /url: "#the-loop-that-eats-itself"
          - text: "#"
      - paragraph [ref=f1e176]:
        - text: The agent runs on the Vercel AI SDK’s
        - code [ref=f1e177]: ToolLoopAgent
        - text: with
        - code [ref=f1e178]: "toolChoice: \"required\""
        - text: ", so it must call a tool every step. It can’t trail off into prose."
      - paragraph [ref=f1e179]:
        - text: Most of the tools are boring.
        - code [ref=f1e180]: editCode
        - text: writes into the editor,
        - code [ref=f1e181]: runTestCases
        - text: clicks Run,
        - code [ref=f1e182]: endInterview
        - text: ends it.
      - paragraph [ref=f1e183]:
        - code [ref=f1e184]: sendResponse
        - text: is the one worth looking at. It speaks, blocks on the interviewer’s reply, and returns that reply as its own tool result.
      - paragraph [ref=f1e185]:
        - text: So the tool result
        - emphasis [ref=f1e186]: is
        - text: the next turn. The SDK’s tool loop and the conversation are the same loop — which means there’s no orchestrator anywhere in the harness, no turn manager, no outer
        - code [ref=f1e187]: while
        - text: . The whole interview is one
        - code [ref=f1e188]: generate()
        - text: call that returns when the model calls
        - code [ref=f1e189]: endInterview
        - text: .
      - paragraph [ref=f1e190]: I didn’t design that. I wrote the obvious thing, noticed the outer loop had nothing left to do, and deleted it.
      - paragraph [ref=f1e191]:
        - 'button "Zoom image: Architecture of the candidate rig: the ToolLoopAgent calls into a live Playwright-driven interview page across three surfaces, every tool result returns stamped with the current surface, and sendResponse sends text to the interviewer over a WebSocket whose reply becomes the next tool result." [ref=f1e192]'
      - heading "The agent has no eyes" [level=2] [ref=f1e193]:
        - text: The agent has no eyes
        - link [ref=f1e194] [cursor=pointer]:
          - /url: "#the-agent-has-no-eyes"
          - text: "#"
      - paragraph [ref=f1e195]: Three surfaces, and a model that only ever receives text. Ask for a code edit while the whiteboard is covering the editor and you get a tool call that does nothing at all — silently, successfully, into the void.
      - paragraph [ref=f1e196]:
        - text: My first fix was navigation tools.
        - code [ref=f1e197]: showCodingPanel
        - text: ","
        - code [ref=f1e198]: showDesignBoard
        - text: ", one per surface. It worked, and it was exactly wrong: four new ways for the model to be somewhere it didn’t mean to be, and every interesting failure now wearing a navigation costume."
      - paragraph [ref=f1e199]: What replaced them is one line in every tool result.
      - generic [ref=f1e201]:
        - code [ref=f1e202]:
          - generic [ref=f1e203]: "async function formatResult(body: string): Promise<string> {"
          - generic [ref=f1e204]: await refreshSurface(); // re-read the live DOM
          - generic [ref=f1e205]: "return `surface=${currentSurface}\\n${body}`;"
          - generic [ref=f1e206]: "}"
        - button "Copy" [ref=f1e207] [cursor=pointer]
      - paragraph [ref=f1e208]:
        - code [ref=f1e209]: surface=ide
        - text: .
        - code [ref=f1e210]: surface=design
        - text: . Every result, no exceptions. The navigation tools went in the bin, and each acting tool now quietly walks to the surface it needs before doing its job.
      - paragraph [ref=f1e211]: The state is never stored and trusted. It gets re-derived from the DOM before every single tool returns, because the page changes underneath the agent between turns. Constantly. There’s a second AI driving the other side of it.
      - heading "Ordering is cheaper than proof" [level=2] [ref=f1e212]:
        - text: Ordering is cheaper than proof
        - link [ref=f1e213] [cursor=pointer]:
          - /url: "#ordering-is-cheaper-than-proof"
          - text: "#"
      - paragraph [ref=f1e214]: "Deriving the state is four visibility checks, and the order is the whole design:"
      - generic [ref=f1e216]:
        - code [ref=f1e217]:
          - generic [ref=f1e218]: if (await whiteboard.isVisible()) currentSurface = "design";
          - generic [ref=f1e219]: else if (await codingWorkbench.isVisible()) currentSurface = "ide";
          - generic [ref=f1e220]: else if (await codingProblemPanel.isVisible()) currentSurface = "problem";
          - generic [ref=f1e221]: else if (await designProblemPanel.isVisible()) currentSurface = "designProblem";
          - generic [ref=f1e222]: else currentSurface = "none";
        - button "Copy" [ref=f1e223] [cursor=pointer]
      - paragraph [ref=f1e224]:
        - code [ref=f1e225]: design
        - text: goes first because the whiteboard sits on top of the coding panel. Flip those two and an open whiteboard reports
        - code [ref=f1e226]: ide
        - text: ", and the agent starts typing code into a canvas."
      - paragraph [ref=f1e227]:
        - code [ref=f1e228]: designProblem
        - text: goes last, and that one has a better reason. The design-brief check is “the panel is showing and there’s no Solve it button.” I couldn’t establish that the coding phase never renders something that would also satisfy it.
      - paragraph [ref=f1e229]: I could have gone and proved it. Instead I ordered the checks so it can’t matter — by the time that branch is reachable, both coding checks have already failed, so a programming interview can’t be routed down the design path no matter what the selectors do.
      - paragraph [ref=f1e230]:
        - 'button "Zoom image: The surface state machine: five states probed in a fixed order — design, ide, problem, designProblem, none — each identified by a concrete DOM condition, with designProblem probed fourth so it is unreachable in a coding-only interview." [ref=f1e231]'
      - paragraph [ref=f1e232]: Proofs rot when the markup changes. The ordering doesn’t.
      - heading "Never throw in a live call" [level=2] [ref=f1e233]:
        - text: Never throw in a live call
        - link [ref=f1e234] [cursor=pointer]:
          - /url: "#never-throw-in-a-live-call"
          - text: "#"
      - paragraph [ref=f1e235]:
        - code [ref=f1e236]: "toolChoice: \"required\""
        - text: has a sharp edge. If a tool throws, the exception comes out of
        - code [ref=f1e237]: generate()
        - text: and takes the whole run with it.
      - paragraph [ref=f1e238]: That call is live. There’s an interviewer mid-question on the other end. Killing the process because a selector timed out is not a thing I’m willing to ship.
      - paragraph [ref=f1e239]: "So tools catch their own errors and hand them back as text:"
      - generic [ref=f1e241]:
        - code [ref=f1e242]:
          - generic [ref=f1e243]: "catch (error) {"
          - generic [ref=f1e244]: "return `Error reading question context: ${errText(error)}`;"
          - generic [ref=f1e245]: "}"
        - button "Copy" [ref=f1e246] [cursor=pointer]
      - paragraph [ref=f1e247]: Now a failure is something the model can read and work around, instead of something that ends the interview.
      - paragraph [ref=f1e248]: One exception, on purpose. Writing code into the editor reads the buffer back and throws if the write didn’t land. If the editor silently dropped it, everything after that point is fiction — better to stop than to keep testing an imaginary solution.
      - heading "Speaking without a microphone" [level=2] [ref=f1e249]:
        - text: Speaking without a microphone
        - link [ref=f1e250] [cursor=pointer]:
          - /url: "#speaking-without-a-microphone"
          - text: "#"
      - paragraph [ref=f1e251]: There’s no microphone and no text-to-speech. The candidate’s speech is text injected straight over the interview’s WebSocket.
      - paragraph [ref=f1e252]: That isn’t laziness. Synthesising audio, playing it into a virtual mic, and hoping the far end transcribes it correctly would turn every test into a test of the audio pipeline. I want to test the interviewer’s reasoning.
      - paragraph [ref=f1e253]: Two things from that layer cost me time and might save you some.
      - paragraph [ref=f1e254]:
        - text: Interrupting the interviewer means sending an interrupt, then waiting for it to confirm it stopped speaking. Arm the waiter
        - emphasis [ref=f1e255]: before
        - text: you send the interrupt. Otherwise the confirmation beats your listener to it and you sit there waiting for an event that already happened — which, naturally, only shows up under load.
      - paragraph [ref=f1e256]:
        - text: And
        - code [ref=f1e257]: ws.send()
        - text: on a socket in CLOSING doesn’t throw. It drops the frame and says nothing. So the send path picks the newest open socket every time rather than caching one, because a cached socket that quietly closed is a message that vanishes with no error anywhere.
      - heading "The bug it found first" [level=2] [ref=f1e258]:
        - text: The bug it found first
        - link [ref=f1e259] [cursor=pointer]:
          - /url: "#the-bug-it-found-first"
          - text: "#"
      - paragraph [ref=f1e260]: All of this exists to catch things. The first real thing it caught wasn’t in my harness.
      - paragraph [ref=f1e261]: Design questions put a brief on screen. The interviewer announces it’s doing that — and never reads the brief aloud.
      - paragraph [ref=f1e262]: A human tester glances at the panel, absorbs it without noticing they did, and answers. My candidate couldn’t. No eyes, only the transcript. So it sat there answering a question nobody had told it.
      - paragraph [ref=f1e263]: Which is also what happens to anyone relying on the audio. Someone using a screen reader. Someone who looked away. The automated candidate had a strictly narrower sensory channel than a human tester, and the narrow channel is the only reason the gap ever became visible.
      - paragraph [ref=f1e264]: "The fix was one rule: fetch the question text before answering a design question. Took ten minutes."
      - heading "If you’re building one of these" [level=2] [ref=f1e265]:
        - text: If you’re building one of these
        - link [ref=f1e266] [cursor=pointer]:
          - /url: "#if-youre-building-one-of-these"
          - text: "#"
      - paragraph [ref=f1e267]: Give the agent fewer tools and better results. My navigation tools looked like capability and were really just four more ways to get lost; a state stamp on every result did the same job with none of the surface.
      - paragraph [ref=f1e268]: Don’t let a tool throw inside a loop where throwing ends a live session. Hand the error back as data and let the model decide what to do with it.
      - paragraph [ref=f1e269]: And when you catch yourself about to prove that some state can’t happen, check whether you can just order things so the question never comes up.
      - paragraph [ref=f1e270]: The thing I keep coming back to, though, is that first test. It was green for two weeks. It was green because six messages existed. Every hard part of this system exists because that green tick was lying, and nothing about the tick itself was ever going to tell me.
